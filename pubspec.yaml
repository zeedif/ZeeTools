name: zeetools
description: "A toolset for managing EPUB files, featuring functionalities such
  as search and replace, EpubCheck validation, image optimization, template
  creation, and conversion from Word files to EPUB, among others."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  archive: ^4.0.9
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  window_manager: ^0.5.1
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
